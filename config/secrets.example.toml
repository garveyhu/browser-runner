# 密钥模板。用法：复制到 <repo>/var/secrets.toml 填自己的值。
# var/ 整目录 gitignore，密钥不会进 git。段名自起，流程 flow.toml 的 needs 与段名对上即可。

# 大模型（OpenAI 兼容接口）：段名 llm.<provider>，流程里 chat(provider="deepseek")
[llm.deepseek]
api_key  = "sk-你的key"
base_url = "https://api.deepseek.com"
model    = "deepseek-chat"

# [llm.qwen]
# api_key  = "你的key"
# base_url = "https://dashscope.aliyun.com/compatible-mode/v1"
# model    = "qwen-plus"

# 平台 token 之类照同样格式加，段名随你起；流程里 ctx.secret("platform.example") 取
# [platform.example]
# token = "..."

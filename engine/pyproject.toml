[project]
name = "browser-runner-engine"
version = "0.1.0"
description = "browser-runner 引擎 + CLI —— attach 真实 Chrome、跑流程（仅 playwright + 标准库）"
requires-python = ">=3.12"
dependencies = ["playwright>=1.48"]

[project.scripts]
browser-runner = "browser_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_runner"]

[tool.hatch.build.targets.wheel.force-include]
"src/browser_runner/chrome_debug.sh" = "browser_runner/chrome_debug.sh"

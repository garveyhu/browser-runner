[project]
name = "browser-runner-api"
version = "0.1.0"
description = "browser-runner FastAPI 后端 —— 引擎的 REST + SSE 外壳"
requires-python = ">=3.12"
dependencies = [
    "browser-runner-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "loguru>=0.7",
]

[project.scripts]
browser-runner-serve = "browser_runner_api.app.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_runner_api"]

[tool.uv.sources]
browser-runner-engine = { workspace = true }
